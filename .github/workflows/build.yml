name: Build ASI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile MenuSkip.asi
        run: cl /LD /EHsc src\dllmain.cpp /Fe:MenuSkip.asi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MenuSkip
          path: MenuSkip.asi
